diet:{en:['A simpler, lighter-tasting seasoning profile.','Choose this for a relatively restrained flavour; it is not a certified low-calorie meal.'],hi:['हल्के और सादे मसालों वाला स्वाद।','कम तीखे स्वाद के लिए अच्छा विकल्प; इसे प्रमाणित लो-कैलोरी डिश न समझें।']},
classic:{en:['Tandoor-style roasted goodness with balanced spices.','A classic seasoned finish keeps the roasted character at the centre.'],hi:['संतुलित मसालों के साथ तंदूरी रोस्टेड स्वाद।','क्लासिक फिनिश में रोस्टेड स्वाद मुख्य रहता है।']},

driproll:{en:['Soft, creamy and extra indulgent in every bite.','This signature roll is finished for a softer, saucier bite.'],hi:['नरम, मलाईदार और भरपूर क्रीमी स्वाद।','इस खास रोल को और सॉफ्ट और सॉसी फिनिश दी जाती है।']},
punjabi:{en:['Bold Punjabi-style spices with a robust tandoori finish.','A hearty, spice-forward chaap for people who like strong flavours.'],hi:['दमदार पंजाबी मसालों वाला तंदूरी स्वाद।','तीखे और भरपूर मसाले पसंद करने वालों के लिए खास चाप।']}

const all=sections.flatMap(s=>s.rows);
const featured=['Classic Malai Chaap','Paneer Achari Tikka','Royal Stuff Chaap','Paneer Cheese Momo','Extra Soft Drip Malai Roll','Punjabi Chaap'];
const $=id=>document.getElementById(id);
function photo(key){return pics[key]||pics.tikka}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let language='en';
try{if(localStorage.getItem('tandoory-language')==='hi')language='hi'}catch(e){}
let lastFocus=null;
const dialog=$('dishDialog');
function priceText(item,t){return item[2]===null?t.ask:t.half+' ₹'+item[2]+'  ·  '+t.fullPrice+' ₹'+item[3]}
function imageHtml(item){return '<img loading="lazy" decoding="async" src="'+photo(item[6])+'" alt="'+escapeHtml(item[language==='hi'?1:0])+'" onerror="this.style.display=\'none\'">'}
function render(){
const t=i18n[language];document.documentElement.lang=language;
$('blessing').textContent=t.blessing;$('langSwitch').textContent=t.switch;$('langSwitch').setAttribute('aria-label',t.switchAria);
$('pureVeg').textContent=t.veg;$('subtitle').textContent=t.subtitle;$('lead').textContent=t.lead;$('offerTitle').innerHTML=t.offer;$('rollText').textContent=t.roll;
$('signatureTitle').textContent=t.signature;$('signatureSub').textContent=t.signatureSub;$('fullTitle').textContent=t.full;$('fullSub').textContent=t.fullSub;
$('nav').innerHTML='<a class="chip" href="#signature">'+t.navSig+'</a>'+sections.map(s=>'<a class="chip" href="#'+s.id+'">'+t.cat[s.idx]+'</a>').join('')+'<a class="chip" href="#contact">'+t.navContact+'</a>';
$('features').innerHTML=featured.map(name=>{const item=all.find(x=>x[0]===name);const n=all.indexOf(item);return '<button type="button" class="feature" data-item="'+n+'"><div class="photo"><div class="photo-fallback">✦</div>'+imageHtml(item)+'</div><div class="feature-text"><strong>'+escapeHtml(item[language==='hi'?1:0])+'</strong><small>'+escapeHtml(flavours[item[5]][language][0])+'</small></div></button>'}).join('');
$('menu').innerHTML=sections.map(s=>'<section class="category" id="'+s.id+'"><div class="cathead"><span>'+t.cat[s.idx]+'</span><small>'+t.veg+' ✦</small></div><div class="item-head"><span></span><span>'+t.half+'</span><span>'+t.fullPrice+'</span></div>'+s.rows.map(item=>{const n=all.indexOf(item),idx=language==='hi'?1:0;return '<button type="button" class="dish" data-item="'+n+'"><span><span class="dish-name">'+escapeHtml(item[idx])+'</span><span class="dish-desc">'+escapeHtml(flavours[item[5]][language][0])+'</span><span class="tap">'+t.tap+'</span></span>'+(item[2]===null?'<span class="price" style="grid-column:2/4;font-size:12px">'+t.ask+'</span>':'<span class="price">₹'+item[2]+'</span><span class="price full">₹'+item[3]+'</span>')+'</button>'}).join('')+'</section>').join('');
$('trust').innerHTML=t.trust.map(x=>'<div class="trust-item"><span>'+x[0]+'</span>'+x[1]+'</div>').join('');
$('qualityNote').textContent=t.note;$('contactTitle').textContent=t.contact;$('location').textContent=t.location;$('delivery').textContent=t.delivery;$('pockets').textContent=t.pockets;$('whatsApp').textContent=t.wa;$('foot').textContent=t.footer;
}
function openItem(n){
const item=all[n];if(!item)return;lastFocus=document.activeElement;const t=i18n[language],profile=flavours[item[5]][language];
$('modalTitle').textContent=item[language==='hi'?1:0];$('modalPrices').textContent=priceText(item,t);
$('modalShort').textContent=profile[0];$('modalHowHeading').textContent=t.how;$('modalHow').textContent=t.base[item[4]]+' '+profile[1];$('photoNote').textContent=t.images;
$('modalImg').style.display='block';$('modalImg').src=photo(item[6]);$('modalImg').alt=item[language==='hi'?1:0]+' — '+t.images;
$('modalOrder').textContent=t.order;
$('modalOrder').href='https://wa.me/917210080540?text='+encodeURIComponent((language==='hi'?'नमस्ते, मुझे ':'Hi! I would like to ask about ')+item[language==='hi'?1:0]+'.');
if(!dialog.open)dialog.showModal();$('closeModal').focus();
}
$('langSwitch').addEventListener('click',()=>{const selected=dialog.open?all.findIndex(x=>x[language==='hi'?1:0]===$('modalTitle').textContent):-1;language=language==='en'?'hi':'en';try{localStorage.setItem('tandoory-language',language)}catch(e){}render();if(selected>=0)openItem(selected)});
document.addEventListener('click',ev=>{const btn=ev.target.closest('[data-item]');if(btn)openItem(Number(btn.dataset.item))});
$('closeModal').addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',ev=>{if(ev.target===dialog)dialog.close()});
dialog.addEventListener('close',()=>{if(lastFocus&&typeof lastFocus.focus==='function')lastFocus.focus()});
$('modalImg').addEventListener('error',function(){this.style.display='none'});
render();
</script>
